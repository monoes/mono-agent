<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search | TikTok fixture</title>
<!-- SYNTHETIC fixture: mimics TikTok's video search results grid (data-e2e
     attributes only; hashed classes are decoys). All captions, handles and
     ids are invented. ?q=nothing renders no results. -->
<style>
  body { font: 14px sans-serif; margin: 0; }
  .css-1-DivSearchContainer { display: grid; grid-template-columns: repeat(3, 200px); gap: 12px; padding: 16px; }
  [data-e2e="search_video-item"] { height: 260px; background: #eee; }
</style>
</head>
<body>
<div class="css-1-DivSearchContainer video-item" id="grid"></div>
<a class="video-item" href="https://www.tiktok.com/@fake_ad/video/7399999999999999999">Sponsored (not a result card)</a>
<script>
(function () {
  const q = new URLSearchParams(location.search).get('q') || '';
  const total = q === 'nothing' ? 0 : 16;
  const grid = document.getElementById('grid');
  let shown = 0;
  const add = (n) => {
    for (let i = 0; i < n && shown < total; i++, shown++) {
      const id = String(7300000000000000000n + BigInt(shown + 1));
      const user = 'fake_maker_' + (shown % 5);
      const cap = 'Synthetic ' + q + ' clip ' + (shown + 1);
      // As on tiktok.com: the result card holds only the thumbnail link
      // (whose alt appends "created by <name> with <sound>" to the caption);
      // caption and author are siblings in the wrapper around the card.
      // ?q=altonly renders no caption element, leaving only the alt.
      const w = document.createElement('div');
      w.className = 'css-2-DivItemContainerForSearch';
      w.innerHTML = '<div data-e2e="search_video-item"><a href="https://www.tiktok.com/@' + user + '/video/' + id + '?is_from_webapp=1"><img alt="' + cap + ' created by Fake Maker with Fake Maker\'s original sound" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="https://p16-sign.example.test/thumb/' + id + '.jpeg"></a></div>' +
        '<div data-e2e="search-card-desc">' +
          (q === 'altonly' ? '' : '<div data-e2e="search-card-video-caption"><span data-e2e="new-desc-span">' + cap + '</span></div>') +
          '<div data-e2e="search-card-info-container"><p data-e2e="search-card-user-unique-id">' + (q === 'altonly' ? user : 'Fake Maker ' + shown) + '</p></div></div>';
      grid.appendChild(w);
    }
  };
  add(8);
  window.addEventListener('scroll', () => {
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 50) setTimeout(() => add(8), 20);
  });
})();
</script>
</body>
</html>
