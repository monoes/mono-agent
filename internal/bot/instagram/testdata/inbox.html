<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- SYNTHETIC fixture: Instagram-like direct inbox with the "Turn on
     Notifications" dialog and a New message button. Invented content. -->
<title>Inbox • Direct</title>
<style>
body { font: 14px sans-serif; margin: 0; }
main { margin-left: 90px; padding: 16px; }
[role="button"] { cursor: pointer; display: block; padding: 8px; border-bottom: 1px solid #eee; }
[role="dialog"] { position: fixed; top: 100px; left: 30%; width: 400px; background: #fff; border: 1px solid #888; z-index: 10; padding: 8px; }
</style>
</head>
<body>
<div role="navigation"><a href="/direct/inbox/"><svg aria-label="Direct" height="24" width="24"><title>Direct</title></svg></a></div>
<main role="main">
  <div><h1>fake.me</h1><div role="button" tabindex="0" id="newMsg"><svg aria-label="New message" height="24" width="24"><title>New message</title></svg></div></div>
  <div aria-label="Chats" role="list" id="chats"></div>
</main>
<div role="dialog" id="notif"><h2>Turn on Notifications</h2><span>Know right away when people follow you or like and comment on your photos.</span>
  <button type="button">Turn On</button><button type="button" id="notNow">Not Now</button></div>
<script>
window.FX = {{FX}};
(function () {
  const FX = window.FX;
  const chats = FX.chats || [{ id: '5001', title: 'fake.bea', last: 'see you soon' }, { id: '5002', title: 'Cy Fixture', last: 'ok!' }, { id: '5003', title: 'fake.bea.two', last: 'hey' }];
  document.querySelector('#chats').innerHTML = chats.map((c) =>
    '<div role="listitem"><div role="button" tabindex="0" data-id="' + c.id + '"><div><img alt="user-profile-picture" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="40" height="40"></div>' +
    '<div><span dir="auto"><span>' + c.title + '</span></span><div><span dir="auto">' + c.last + '</span> · <span>1d</span></div></div></div></div>').join('');
  document.querySelectorAll('#chats [role="button"]').forEach((b) => b.addEventListener('click', () => { location.href = '/direct/t/' + b.dataset.id + '/'; }));
  document.querySelector('#notNow').addEventListener('click', () => { document.querySelector('#notif').remove(); fetch('/api/v1/notifications/dismiss/', { method: 'POST', body: '' }); });
  document.querySelector('#newMsg').addEventListener('click', () => { location.href = '/direct/new/'; });
})();
</script>
</body>
</html>
