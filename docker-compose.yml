# mono-agent daemon — example compose file.
#
# State paths (verified against the source):
#   SQLite DB      $HOME/.monoagent/monoagent.db   (cmd/monoagentcli/root.go --db-path default)
#   Workflow JSON  $HOME/.monoagent/workflows/     (cmd/monoagentcli/workflow.go newHybridStore)
#   Secrets vault  $HOME/.monoagent/vault/         (internal/vault/vault.go VaultDir)
#   Config cache   $HOME/.monoagent/configs/       (internal/config via ConfigManager)
# The image sets HOME=/data, so the single named volume below persists all
# of it (DB, workflows, vault, configs, downloads).

services:
  monoagent:
    build: .
    image: monoagent:latest
    container_name: monoagent
    restart: unless-stopped

    # ── Webhook trigger endpoint ────────────────────────────────────────────
    # The engine's webhook server binds 127.0.0.1:9321 by default
    # (internal/workflow/engine.go applyEngineDefaults) — loopback-only, so
    # under Docker's default bridge network a plain `ports` mapping cannot
    # reach it. MONOAGENT_WEBHOOK_ADDR overrides the bind (env > config >
    # default), so binding 0.0.0.0 inside the container makes the published
    # port below genuinely forward.
    #
    # SECURITY:
    #   - 0.0.0.0 here is only the container's interface; exposure is still
    #     governed by the `ports` mapping. Prefer publishing to host
    #     loopback ("127.0.0.1:9321:9321") unless remote callers are really
    #     needed, and give webhook nodes an auth secret (auth_header/
    #     auth_token) or HMAC secret — anyone who can reach the port can
    #     fire an unauthenticated webhook.
    #   - Any non-loopback MONOAGENT_WEBHOOK_ADDR (0.0.0.0 included) is now
    #     ALWAYS served over TLS — the server auto-generates and caches a
    #     self-signed certificate under $HOME/.monoagent/webhook-tls/ if no
    #     explicit one is configured, and refuses to fall back to plaintext.
    #     Callers therefore need `https://`, and (with the self-signed cert)
    #     must skip verification or trust that cert explicitly. For a real
    #     certificate instead, mount it into the container and set
    #     MONOAGENT_WEBHOOK_TLS_CERT / MONOAGENT_WEBHOOK_TLS_KEY to its path.
    #     A loopback bind (127.0.0.1, the default) is unaffected — plain
    #     HTTP, same-user trust, no ceremony.
    #   - Browser-based callers need MONOAGENT_WEBHOOK_ALLOWED_ORIGINS (a
    #     comma-separated origin allowlist); without it the server emits NO
    #     CORS headers, so cross-origin browser requests are blocked.
    environment:
      MONOAGENT_WEBHOOK_ADDR: "0.0.0.0:9321"
      # MONOAGENT_WEBHOOK_ALLOWED_ORIGINS: "https://app.example.com"
      # Real certificate instead of the auto-generated self-signed one
      # (paths inside the container — mount the cert/key via `volumes`):
      # MONOAGENT_WEBHOOK_TLS_CERT: "/data/tls/cert.pem"
      # MONOAGENT_WEBHOOK_TLS_KEY: "/data/tls/key.pem"
    ports:
      - "127.0.0.1:9321:9321"
      # Remote callers instead of host loopback only — pair with webhook
      # auth secrets before using:
      # - "9321:9321"

    volumes:
      - monoagent-data:/data

    # Usage:
    #   docker compose up -d --build
    #   # import a workflow from the repo checkout:
    #   docker exec monoagent monoagentcli workflow import --file /dev/stdin \
    #     < examples/http-to-slack.json
    #   # (or mount ./examples into the container and import from there)
    #   # activate its triggers (kept alive by the daemon):
    #   docker exec monoagent monoagentcli workflow activate <id>

volumes:
  monoagent-data:
