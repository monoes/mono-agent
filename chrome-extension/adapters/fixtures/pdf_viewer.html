<!-- What Chrome's built-in PDF viewer actually is, as a document: an <embed>
     and nothing else. Every byte of the paper is inside a plugin the page
     cannot reach, so an HTML capture of this tab archives an empty body. -->
<!doctype html>
<html><head><meta name="color-scheme" content="light dark"></head>
<body style="height:100%;width:100%;overflow:hidden;margin:0">
<embed name="F87E7A1D9C2B4E0A" style="position:absolute;left:0;top:0;" width="100%" height="100%"
       src="about:blank" type="application/pdf" internalid="F87E7A1D9C2B4E0A">
</body></html>
