<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.connected { background: #22c55e; }
    .dot.disconnected { background: #ef4444; }
    .dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }
    .dot.unpaired { background: #ef4444; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status-text {
      font-weight: 500;
    }
    .url-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e5e5e5;
    }
    label {
      display: block;
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
      font-family: monospace;
    }
    button {
      margin-top: 8px;
      padding: 6px 12px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #1d4ed8; }
    .saved-msg {
      color: #22c55e;
      font-size: 11px;
      margin-top: 4px;
      display: none;
    }
    .unsafe-override {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #b45309;
      margin-top: 8px;
      margin-bottom: 0;
      cursor: pointer;
    }
    .unsafe-override input {
      margin: 0;
      flex-shrink: 0;
    }
    .error-msg {
      color: #ef4444;
      font-size: 11px;
      margin-top: 4px;
      display: none;
    }
    .site-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 3px 0;
      font-family: monospace;
    }
    .site-row span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .site-row button {
      margin: 0;
      padding: 2px 6px;
      background: #ef4444;
      flex-shrink: 0;
    }
    .site-row button:hover { background: #dc2626; }
    .empty-hint {
      color: #999;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h3>MonoAgent Bridge</h3>
  <div class="status-row">
    <div id="dot" class="dot disconnected"></div>
    <span id="status-text" class="status-text">Checking...</span>
  </div>
  <div class="url-section">
    <label for="pairing-token">Pairing token</label>
    <input type="text" id="pairing-token" placeholder="paste output of: monoagentcli extension pair" />
    <button id="pair-btn">Pair &amp; Reconnect</button>
    <div id="pair-saved-msg" class="saved-msg">Saved and reconnecting...</div>
  </div>
  <div class="url-section">
    <label for="site-origin">Authorize a site (e.g. https://example.com/*)</label>
    <input type="text" id="site-origin" placeholder="https://example.com/*" />
    <button id="grant-btn">Grant Access</button>
    <div id="grant-error-msg" class="error-msg"></div>
    <label style="margin-top: 10px;">Authorized sites</label>
    <ul id="authorized-list" style="list-style: none; padding: 0; margin: 0; font-size: 12px;"></ul>
  </div>
  <div class="url-section">
    <label for="ws-url">WebSocket URL</label>
    <input type="text" id="ws-url" placeholder="ws://127.0.0.1:9222/monoagent" />
    <button id="save-btn">Save &amp; Reconnect</button>
    <label class="unsafe-override" title="Session-only: cleared when this popup reopens and when the browser restarts.">
      <input type="checkbox" id="allow-remote" />
      Allow non-loopback server (unsafe)
    </label>
    <div id="saved-msg" class="saved-msg">Saved and reconnecting...</div>
    <div id="error-msg" class="error-msg"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
