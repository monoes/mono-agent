<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org Arena</title>
<style>
  :root {
    --bg: #0A1022; --grid: #1E2B4F; --panel: #111A33; --line: #2A3450;
    --ink: #E8EAF2; --ink-2: #C8D0E6; --ink-3: #7E879F;
    --accent: #E8A33D; --teal: #3EC9BE; --violet: #9A88F0; --red: #F06A66; --green: #4CC27A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; overflow: hidden; }
  #layout { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: 1fr; height: 100%; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #sidebar { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  .panel { border-bottom: 1px solid var(--line); padding: 10px 12px; }
  .panel h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  #leaderboard-list div { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  #ticker { flex: 1; overflow-y: auto; padding: 10px 12px; font-size: 12px; line-height: 1.5; color: var(--ink-2); }
  #ticker div { padding: 2px 0; border-bottom: 1px dashed var(--line); }
  #achievements div { font-size: 12px; padding: 2px 0; color: var(--accent); }
  .toast { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent); color: var(--accent); padding: 8px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  #question-banner { position: absolute; bottom: 16px; left: 16px; right: 16px; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 10px 16px; display: none; font-size: 13px; }
  #question-banner.show { display: block; }
  #conn { position: absolute; top: 8px; right: 8px; font-size: 10px; color: var(--ink-3); }
</style>
</head>
<body>
<div id="layout">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="conn">connecting…</div>
    <div class="toast" id="toast"></div>
    <div id="question-banner"></div>
  </div>
  <div id="sidebar">
    <div class="panel"><h2>Leaderboard</h2><div id="leaderboard-list"></div></div>
    <div class="panel"><h2>Achievements</h2><div id="achievements"></div></div>
    <div class="panel" style="border-bottom:0; flex:1; display:flex; flex-direction:column; min-height:0;">
      <h2>Ticker</h2>
      <div id="ticker"></div>
    </div>
  </div>
</div>
<script>
const ORGS = ['forge', 'anvil', 'herald'];
const COLORS = { forge: '#E8A33D', anvil: '#9A88F0', herald: '#3EC9BE' };
// District layout — fixed rectangles matching the published mock's composition.
const DISTRICTS = {
  forge:  { x: 0.03, y: 0.08, w: 0.34, h: 0.40 },
  anvil:  { x: 0.03, y: 0.54, w: 0.34, h: 0.40 },
  herald: { x: 0.42, y: 0.30, w: 0.34, h: 0.55 },
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() {
  const stage = document.getElementById('stage');
  canvas.width = stage.clientWidth * devicePixelRatio;
  canvas.height = stage.clientHeight * devicePixelRatio;
  canvas.style.width = stage.clientWidth + 'px';
  canvas.style.height = stage.clientHeight + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

let latest = null;
let couriers = []; // transient animated dots for messages/xorg, {fromX,fromY,toX,toY,t0,dur,color}
let seenTicker = new Set();
let seenAchievements = new Set();
let rolePx = {}; // "org:role" -> {x,y}, refreshed every draw() frame; read by spawnCouriersFromBeats

function districtPx(name) {
  const stage = document.getElementById('stage');
  const w = stage.clientWidth, h = stage.clientHeight;
  const d = DISTRICTS[name];
  return { x: d.x * w, y: d.y * h, w: d.w * w, h: d.h * h };
}

function rolePositions(name, roleIds) {
  const d = districtPx(name);
  const n = Math.max(roleIds.length, 1);
  return roleIds.map((id, i) => ({
    id,
    x: d.x + d.w * (0.18 + 0.64 * (i / Math.max(n - 1, 1))),
    y: d.y + d.h * 0.6,
  }));
}

function statusColor(status) {
  if (status === 'working') return '#F3C880';
  if (status === 'completed') return '#4CC27A';
  if (status === 'idle') return '#7E879F';
  return '#3A4568';
}

function draw() {
  const stage = document.getElementById('stage');
  const w = stage.clientWidth, h = stage.clientHeight;
  ctx.fillStyle = '#0A1022';
  ctx.fillRect(0, 0, w, h);
  // grid
  ctx.strokeStyle = '#1E2B4F'; ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 24) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

  if (!latest) { ctx.fillStyle = '#7E879F'; ctx.font = '14px monospace'; ctx.fillText('waiting for the first event…', 20, 30); return; }

  rolePx = {};
  for (const org of ORGS) {
    const o = latest.orgs[org];
    if (!o) continue;
    const d = districtPx(org);
    const color = COLORS[org];
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.fillStyle = 'rgba(17,26,51,0.9)';
    roundRect(d.x, d.y, d.w, d.h, 8); ctx.fill(); ctx.stroke();

    ctx.fillStyle = color; ctx.font = 'bold 15px monospace';
    ctx.fillText(o.title.toUpperCase() + (org === 'herald' ? '  (house)' : ''), d.x + 12, d.y + 22);
    ctx.fillStyle = '#7E879F'; ctx.font = '10px monospace';
    ctx.fillText(`score ${o.score}${org === 'herald' ? '' : ''}`, d.x + 12, d.y + 36);

    // power bar
    const barY = d.y + d.h - 14, barW = d.w - 24;
    ctx.strokeStyle = '#1E2B4F'; ctx.fillStyle = '#1E2B4F';
    ctx.fillRect(d.x + 12, barY, barW, 6);
    ctx.fillStyle = o.power < 0.2 ? '#F06A66' : color;
    ctx.fillRect(d.x + 12, barY, barW * Math.max(0, Math.min(1, o.power)), 6);
    ctx.fillStyle = '#7E879F'; ctx.font = '9px monospace';
    ctx.fillText(`power ${(o.power * 100).toFixed(0)}%`, d.x + 12, barY - 4);

    const roleIds = Object.keys(o.roles);
    const positions = rolePositions(org, roleIds);
    for (const p of positions) {
      const role = o.roles[p.id];
      rolePx[`${org}:${p.id}`] = p;
      ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
      ctx.fillStyle = statusColor(role.status); ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      if (role.gated) {
        ctx.fillStyle = '#F06A66'; ctx.font = '14px monospace';
        ctx.fillText('🔒', p.x - 7, p.y - 20);
      }
      ctx.fillStyle = '#0A1022'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
      ctx.fillText(role.title.split(' ')[0].slice(0, 6), p.x, p.y + 3);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#C8D0E6'; ctx.font = '9px monospace';
      ctx.fillText(p.id, p.x - 14, p.y + 28);
    }

    // loot crates: last few assets as small squares along the district floor
    (o.assets || []).slice(-6).forEach((a, i) => {
      const cx = d.x + 12 + i * 18, cy = d.y + d.h - 30;
      ctx.fillStyle = color; ctx.fillRect(cx, cy, 12, 10);
      ctx.strokeStyle = '#0A1022'; ctx.strokeRect(cx, cy, 12, 10);
    });
  }

  // couriers/drones
  const now = performance.now();
  couriers = couriers.filter((c) => now - c.t0 < c.dur);
  for (const c of couriers) {
    const t = Math.min(1, (now - c.t0) / c.dur);
    const x = c.fromX + (c.toX - c.fromX) * t;
    const y = c.fromY + (c.toY - c.fromY) * t;
    ctx.beginPath(); ctx.arc(x, y, c.xorg ? 6 : 4, 0, Math.PI * 2);
    ctx.fillStyle = c.color; ctx.fill();
    if (c.xorg) {
      ctx.strokeStyle = c.color; ctx.globalAlpha = 0.4; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(c.fromX, c.fromY); ctx.lineTo(c.toX, c.toY); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function showToast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function renderSidebar(state) {
  const lb = document.getElementById('leaderboard-list');
  lb.innerHTML = state.leaderboard.map((r, i) =>
    `<div><span>${i + 1}. ${r.title}</span><span>${r.score}</span></div>`).join('');

  const ach = document.getElementById('achievements');
  for (const a of state.achievementsFeed) {
    const key = a.org + a.key + a.ts;
    if (seenAchievements.has(key)) continue;
    seenAchievements.add(key);
    const div = document.createElement('div');
    div.textContent = `🏆 ${a.org} — ${a.label}`;
    ach.prepend(div);
    showToast(`${a.org.toUpperCase()}: ${a.label.toUpperCase()}`);
  }

  const tk = document.getElementById('ticker');
  for (const t of state.ticker) {
    const key = t.ts + t.line;
    if (seenTicker.has(key)) continue;
    seenTicker.add(key);
    const div = document.createElement('div');
    div.textContent = t.line;
    tk.prepend(div);
  }
  while (tk.children.length > 40) tk.removeChild(tk.lastChild);

  const qb = document.getElementById('question-banner');
  if (state.activeQuestion) {
    qb.classList.add('show');
    const secsLeft = Math.max(0, Math.round((state.activeQuestion.deadline - Date.now()) / 1000));
    qb.innerHTML = `❓ <b>${state.activeQuestion.org}/${state.activeQuestion.role}</b> asks: ${state.activeQuestion.question} — vote at <b>/vote</b> (${secsLeft}s)`;
  } else {
    qb.classList.remove('show');
  }
}

let seenBeats = new Set();
function pointForAddress(addr, fallbackOrg) {
  // addr is either a bare role id (same-org message) or "org:role" (xorg).
  const [maybeOrg, maybeRole] = addr.includes(':') ? addr.split(':') : [fallbackOrg, addr];
  const key = `${maybeOrg}:${maybeRole}`;
  if (rolePx[key]) return rolePx[key];
  return null; // role not drawn yet (e.g. first frame) — courier just won't spawn this tick
}

function spawnCouriersFromBeats(state) {
  for (const b of state.beats || []) {
    const key = `${b.ts}:${b.kind}:${b.from}:${b.to}`;
    if (seenBeats.has(key)) continue;
    seenBeats.add(key);
    if (b.kind === 'asset') continue; // assets render as crates, not couriers
    const from = pointForAddress(b.from, b.org);
    const to = pointForAddress(b.to, b.org);
    if (!from || !to) continue;
    couriers.push({
      fromX: from.x, fromY: from.y, toX: to.x, toY: to.y,
      t0: performance.now(), dur: b.kind === 'xorg' ? 1400 : 800,
      color: COLORS[b.org] || '#E8A33D', xorg: b.kind === 'xorg',
    });
  }
  if (seenBeats.size > 200) seenBeats = new Set([...seenBeats].slice(-100));
}

let es;
function connect() {
  es = new EventSource('/events');
  es.onopen = () => document.getElementById('conn').textContent = 'live';
  es.onerror = () => { document.getElementById('conn').textContent = 'reconnecting…'; };
  es.onmessage = (e) => {
    const state = JSON.parse(e.data);
    latest = state;
    renderSidebar(state);
    spawnCouriersFromBeats(state);
  };
}
connect();
</script>
</body>
</html>
