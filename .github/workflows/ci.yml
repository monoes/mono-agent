name: CI

on:
  push:
  pull_request:

jobs:
  # Guards MA-04: .mcp.json must pin an exact Monomind version. A floating
  # `@latest`/caret/tilde reference means a future, unreviewed package
  # publish executes locally the next time this repo's MCP server starts.
  mcp-pin-guard:
    name: Guard .mcp.json version pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject floating Monomind version
        run: |
          if grep -qE 'monomind(cli)?@(latest|\^|~)' .mcp.json; then
            echo "::error file=.mcp.json::Monomind must be pinned to an exact version (no @latest, ^, or ~)"
            exit 1
          fi
          if ! grep -q '@monoes/monomindcli@' .mcp.json; then
            echo "::error file=.mcp.json::.mcp.json must reference the canonical @monoes/monomindcli package"
            exit 1
          fi

  # Closes issue #23's CI gap: installs the exact Monomind version .mcp.json
  # pins and runs the real client/server handshake (internal/monomind
  # .Handshake), so a protocol/version mismatch between this repo and the
  # pinned Monomind release fails CI instead of surfacing as a runtime
  # error for users. See docs/plans/local-agent-monomind-delegation.md §11.
  monomind-smoke:
    name: Monomind integration smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install pinned Monomind version
        run: |
          version=$(grep -oE '@monoes/monomindcli@[0-9][0-9.]*' .mcp.json | cut -d@ -f3)
          if [ -z "$version" ]; then
            echo "::error file=.mcp.json::could not extract a pinned @monoes/monomindcli version"
            exit 1
          fi
          npm install -g "@monoes/monomindcli@${version}"
      - name: Run handshake smoke test
        run: MONOMIND_SMOKE=1 go test ./internal/monomind/... -run TestSmoke_RealMonomindHandshake -v

  # Closes issue #20's OpenAPI acceptance criterion ("OpenAPI 3 spec shipped
  # and validated in CI"): validates internal/httpapi/openapi.yaml against
  # the real OpenAPI 3.0 meta-schema (not just YAML syntax) so a hand-edited
  # spec that drifts into an invalid shape fails CI instead of only being
  # caught by a human reviewer. Pinned exact version — see mcp-pin-guard
  # above for why this repo never runs an unpinned npm package in CI.
  openapi-lint:
    name: Validate HTTP API OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Lint OpenAPI spec against the OpenAPI 3 meta-schema
        run: npx --yes @redocly/cli@2.49.0 lint internal/httpapi/openapi.yaml

  # Scheduled + on-push dependency vulnerability scanning (MA-06/MA-11).
  vuln-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json
      - name: npm audit (frontend, production deps)
        # --omit=dev: the frontend's only current high-severity finding is an
        # esbuild/vite dev-server advisory (GHSA-67mh-4wv8-2f99) in build
        # tooling that never ships, and fixing it needs a breaking vite v8
        # bump — track it separately rather than gating CI on a dev-only
        # dependency. Production dependencies are audited at full severity.
        working-directory: wails-app/frontend
        run: npm audit --omit=dev --audit-level=high

  # Issue #24: node schemas for a small, growing set of node types are
  # generated from `schema:"..."` struct tags (internal/tools/schemagen)
  # instead of hand-written. This regenerates just those files and fails if
  # the committed JSON drifts from what the generator produces — e.g.
  # someone hand-edited a generated schema file, or edited the struct tags
  # without re-running the generator. Deliberately scoped to only the node
  # types listed in internal/tools/schemagen.Manifest (see
  # internal/workflow/schemas/README.md) — most schema files are still
  # hand-written and are not touched by this check.
  schemagen-check:
    name: Generated node schemas up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check generated schemas match committed files
        run: go run ./cmd/schemagen -check

  # NOTE: no CGO_ENABLED=0 here. `go test -race` requires cgo ("go: -race
  # requires cgo" on Go 1.25), and ubuntu runners ship gcc — the default
  # CGO_ENABLED=1 works for modernc.org/sqlite and everything else we use.
  test:
    name: Build & test (default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  test-social:
    name: Build & test (social)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -tags social ./...

      - name: Vet
        run: go vet -tags social ./...

      - name: Test
        run: go test -tags social ./... -race

  # Mirror of the release.yml test gate's Wails steps (minus release/tagging):
  # system deps for GTK/WebKit headers, frontend build (main.go //go:embeds
  # frontend/dist — it must exist with content at compile time), then vet and
  # build the wails-app Go module. webkit2_41 tag because ubuntu-latest
  # (24.04) has no webkit2gtk-4.0 dev package.
  wails:
    name: Wails GUI module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: wails-app/go.mod

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev gcc pkg-config

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Build frontend
        # npm/cli#7622 (npm ci hard-failing with EBADPLATFORM on optional
        # deps) was fixed by npm/cli#9262, shipped in npm 12.0.0
        # (2026-07-08). node-version above is 22 (bumped from 20) because
        # npm 12 requires Node >=22.22; Node 22's own bundled npm predates
        # 12, so it's installed explicitly too.
        run: |
          npm install -g npm@12
          npm ci
          npm run build
        working-directory: wails-app/frontend

      - name: Vet
        run: go vet -tags webkit2_41 ./...
        working-directory: wails-app

      - name: Build
        run: go build -tags webkit2_41 ./...
        working-directory: wails-app
