name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

# Serialize releases: two pushes computing "next version" off the same last
# tag would race to create the same tag, and the loser's whole run would die
# before any build/release job started. Queue instead of running concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── 0. Test gate — vet/test both Go modules and the frontend. Nothing else
  # in this workflow runs (not even tag creation) until this passes, since
  # every push to master otherwise auto-releases regardless of test outcome.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet and test core (root module)
        run: |
          go vet ./...
          go test -timeout 25m ./...

      - name: Install Linux system dependencies (needed to compile the Wails Go module)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev gcc pkg-config

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Install frontend dependencies
        # npm/cli#7622 (npm ci hard-failing with EBADPLATFORM on optional
        # deps like esbuild's platform binaries) was fixed by npm/cli#9262,
        # shipped in npm 12.0.0 (2026-07-08). node-version above is 22
        # (bumped from 20) because npm 12 requires Node >=22.22; Node 22's
        # own bundled npm predates 12, so it's installed explicitly too.
        run: |
          npm install -g npm@12
          npm ci
        working-directory: wails-app/frontend

      - name: Test and build frontend
        working-directory: wails-app/frontend
        run: |
          npm test -- --run
          npm run build

      # Must run after the frontend build: main.go has //go:embed all:frontend/dist,
      # which requires that directory to exist (with content) at compile time — go
      # vet/build fail outright otherwise, not just at runtime.
      - name: Vet, test and build Wails GUI backend (separate go.mod)
        working-directory: wails-app
        run: |
          go vet -tags webkit2_41 ./...
          go test -tags webkit2_41 ./...
          go build -tags webkit2_41 ./...

  # ─── 1. Determine next semantic version ───────────────────────────────────
  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag:  ${{ steps.semver.outputs.tag }}
      prev: ${{ steps.semver.outputs.prev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next semver
        id: semver
        run: |
          LAST=$(git tag --sort=-v:refname | head -1)
          if [ -z "$LAST" ]; then
            NEXT="v0.1.0"; PREV=""
          else
            MAJOR=$(echo "$LAST" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LAST" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LAST" | sed 's/v//' | cut -d. -f3)
            if git log --oneline "${LAST}..HEAD" | grep -qE '^[0-9a-f]+ feat(\(.+\))?:'; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"; PREV="$LAST"
          fi
          echo "tag=$NEXT"  >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "Bumping ${PREV} → ${NEXT}"

      - name: Create tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.semver.outputs.tag }}" -m "Release ${{ steps.semver.outputs.tag }}"
          git push origin "${{ steps.semver.outputs.tag }}"

  # ─── 2a. Build CLI (cross-compile, CGO_ENABLED=0) ─────────────────────────
  build-cli:
    needs: version
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build CLI for linux and windows
        run: |
          LD="-X main.version=${TAG} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LD" -o dist/monoagentcli-linux-amd64    ./cmd/monoagentcli
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LD" -o dist/monoagentcli-linux-arm64    ./cmd/monoagentcli
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LD" -o dist/monoagentcli-windows-amd64.exe ./cmd/monoagentcli

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-binaries-linux-windows
          path: dist/

  # ─── 2a2. Build CLI for macOS (native — cross-compiled darwin binaries built
  # on ubuntu-latest carry an ad-hoc signature that newer macOS's
  # AppleSystemPolicy rejects outright at exec time: "load code signature
  # error 2" / SIGKILL. Building natively on macos-latest and explicitly
  # ad-hoc re-signing each binary produces a signature this Mac's AMFI
  # enforcement actually accepts. ─────────────────────────────────────────
  build-cli-macos:
    needs: version
    runs-on: macos-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prove hardened runtime checks reject unhardened assets
        run: bash scripts/check-hardened-runtime-test.sh

      - name: Build CLI for macOS (native)
        run: |
          LD="-X main.version=${TAG} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LD" -o dist/monoagentcli-darwin-amd64 ./cmd/monoagentcli
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LD" -o dist/monoagentcli-darwin-arm64 ./cmd/monoagentcli
          codesign --force --options runtime --sign - dist/monoagentcli-darwin-amd64
          codesign --force --options runtime --sign - dist/monoagentcli-darwin-arm64

      - name: Check the hardened runtime (macOS CLI)
        shell: bash
        run: |
          for f in dist/monoagentcli-darwin-*; do
            codesign --verify --strict "$f"
            if [ "$(codesign -dv "$f" 2>&1 | grep -c 'flags=0x[0-9a-f]*([^)]*runtime')" -eq 0 ]; then
              echo "::error::$f is not signed with the hardened runtime"; exit 1
            fi
          done
          arch="$(uname -m)"; [ "$arch" != x86_64 ] || arch=amd64
          output="$(DYLD_PRINT_LIBRARIES=1 "dist/monoagentcli-darwin-${arch}" --help 2>&1)"
          if [ "$(printf '%s\n' "$output" | grep -c '^dyld\[')" -ne 0 ]; then
            echo "::error::dyld honours DYLD_ variables for monoagentcli-darwin-${arch}"; exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-binaries-macos
          path: dist/

  # ─── 2b. Build macOS app (Apple Silicon / arm64) ──────────────────────────
  build-macos-arm64:
    needs: version
    runs-on: macos-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: wails-app/go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install frontend dependencies
        # npm/cli#7622 (npm ci hard-failing with EBADPLATFORM on optional
        # deps like esbuild's platform binaries) was fixed by npm/cli#9262,
        # shipped in npm 12.0.0 (2026-07-08). node-version above is 22
        # (bumped from 20) because npm 12 requires Node >=22.22; Node 22's
        # own bundled npm predates 12, so it's installed explicitly too.
        run: |
          npm install -g npm@12
          npm ci
        working-directory: wails-app/frontend

      - name: Build CLI (bundled, arm64)
        run: |
          LD="-X main.version=${TAG} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 go build -ldflags "$LD" -o wails-app/monoagentcli ./cmd/monoagentcli

      - name: Build Wails app (arm64)
        working-directory: wails-app
        run: |
          LD="-X main.version=${TAG} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -ldflags "$LD" -skipbindings=false

      - name: Bundle CLI into .app and zip
        run: |
          APP="wails-app/build/bin/MonoAgent.app"
          cp wails-app/monoagentcli "${APP}/Contents/MacOS/monoagentcli"
          mkdir -p "${APP}/Contents/Resources"
          cp NOTICE "${APP}/Contents/Resources/NOTICE"
          # Sign inside out: the app signature seals the bundled CLI.
          codesign --force --options runtime --sign - "${APP}/Contents/MacOS/monoagentcli"
          codesign --force --options runtime --sign - "${APP}"
          codesign --verify --strict --deep "${APP}"
          for f in "${APP}" "${APP}/Contents/MacOS/monoagentcli"; do
            if [ "$(codesign -dv "$f" 2>&1 | grep -c 'flags=0x[0-9a-f]*([^)]*runtime')" -eq 0 ]; then
              echo "::error::$f is not signed with the hardened runtime"; exit 1
            fi
          done
          output="$(DYLD_PRINT_LIBRARIES=1 "${APP}/Contents/MacOS/monoagentcli" --help 2>&1)"
          if [ "$(printf '%s\n' "$output" | grep -c '^dyld\[')" -ne 0 ]; then
            echo "::error::dyld honours DYLD_ variables for the bundled CLI"; exit 1
          fi
          mkdir -p dist
          (cd wails-app/build/bin && zip -r "../../../dist/MonoAgent-darwin-arm64.zip" "MonoAgent.app")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64-app
          path: dist/MonoAgent-darwin-arm64.zip

  # ─── 2d. Build Windows app ────────────────────────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: wails-app/go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install frontend dependencies
        # npm/cli#7622 (npm ci hard-failing with EBADPLATFORM on optional
        # deps like esbuild's platform binaries) was fixed by npm/cli#9262,
        # shipped in npm 12.0.0 (2026-07-08). node-version above is 22
        # (bumped from 20) because npm 12 requires Node >=22.22; Node 22's
        # own bundled npm predates 12, so it's installed explicitly too.
        run: |
          npm install -g npm@12
          npm ci
        working-directory: wails-app/frontend

      - name: Build CLI (bundled, windows)
        run: |
          LD="-X main.version=${TAG} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 go build -ldflags "$LD" -o wails-app/monoagentcli.exe ./cmd/monoagentcli

      - name: Build Wails app (windows)
        working-directory: wails-app
        run: |
          LD="-X main.version=${TAG} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -ldflags "$LD" -skipbindings=false

      - name: Collect artifacts
        run: |
          mkdir -p dist
          # Copy Wails-built exe (outputfilename = monoagent-ui → monoagent-ui.exe)
          cp wails-app/build/bin/monoagent-ui.exe dist/MonoAgent-windows-amd64.exe
          cp wails-app/monoagentcli.exe dist/monoagentcli-windows-amd64-bundled.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-app
          path: dist/

  # ─── 2e. Build Linux app ──────────────────────────────────────────────────
  build-linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: wails-app/go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          # ubuntu-latest is Ubuntu 24.04 (Noble) — webkit2gtk-4.0 no longer exists; use 4.1
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev gcc pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install frontend dependencies
        # npm/cli#7622 (npm ci hard-failing with EBADPLATFORM on optional
        # deps like esbuild's platform binaries) was fixed by npm/cli#9262,
        # shipped in npm 12.0.0 (2026-07-08). node-version above is 22
        # (bumped from 20) because npm 12 requires Node >=22.22; Node 22's
        # own bundled npm predates 12, so it's installed explicitly too.
        run: |
          npm install -g npm@12
          npm ci
        working-directory: wails-app/frontend

      - name: Build CLI (bundled, linux)
        run: |
          LD="-X main.version=${TAG} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 go build -ldflags "$LD" -o wails-app/monoagentcli-linux ./cmd/monoagentcli

      - name: Build Wails app (linux)
        working-directory: wails-app
        run: |
          LD="-X main.version=${TAG} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          wails build -ldflags "$LD" -skipbindings=false -tags webkit2_41

      - name: Package artifacts
        run: |
          mkdir -p dist
          # Wails linux binary (outputfilename = monoagent-ui)
          cp wails-app/build/bin/monoagent-ui dist/MonoAgent-linux-amd64
          chmod +x dist/MonoAgent-linux-amd64
          # Bundle with the CLI sidecar under the name the app looks for next
          # to itself (wails-app/app.go findMonoAgentCLI; older tarballs used
          # monoagentcli-linux-amd64-bundled, which the app still accepts).
          mkdir -p dist/linux-pkg
          cp dist/MonoAgent-linux-amd64 dist/linux-pkg/MonoAgent-linux-amd64
          cp wails-app/monoagentcli-linux dist/linux-pkg/monoagentcli
          chmod +x dist/linux-pkg/monoagentcli
          cp NOTICE dist/linux-pkg/NOTICE
          tar -czf dist/MonoAgent-linux-amd64.tar.gz -C dist/linux-pkg MonoAgent-linux-amd64 monoagentcli NOTICE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-app
          path: |
            dist/MonoAgent-linux-amd64.tar.gz

  # ─── 2f. Package Chrome extension (unpacked bridge, not Web-Store-published) ─
  build-chrome-extension:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Zip chrome extension
        run: |
          mkdir -p dist
          cp NOTICE chrome-extension/NOTICE
          zip -r dist/monoagent-chrome-extension.zip chrome-extension -x '*.DS_Store' '*.test.mjs'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-extension
          path: dist/monoagent-chrome-extension.zip

  # ─── 2g. Release guard: no shipped Go binary carries the devaccount tag ────
  # The tag trusts a development signing key and points the account gate at a fake monoes.me
  # (spec D11, D24), so a binary built with it must never be published. This reads the build
  # settings of every Go binary in every artifact (`go version -m`, scripts/check-release-tags.sh),
  # the archives of the desktop apps included. Eleven ship: five CLI assets, the Windows app and its
  # bundled CLI, the Linux tarball's app and CLI, the macOS bundle's app and CLI.
  release-guard:
    needs: [build-cli, build-cli-macos, build-macos-arm64, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
      - name: No shipped Go binary carries the devaccount tag
        run: bash scripts/check-release-tags.sh --min 11 artifacts/

  # ─── 2h. Unsigned update manifest ──────────────────────────────────────────
  # Writes SHA256SUMS and manifest.json (cmd/release-manifest, a maintainer tool that is not in
  # any release). It is UNSIGNED and this job never sees the signing key. It is signed by the
  # `sign-manifest` job below, after checking it against the built assets; see
  # docs/release-runbook.md.
  release-manifest:
    needs: [version, release-guard, build-chrome-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
      RELEASES_REPO: ${{ secrets.RELEASES_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Generate unsigned manifest and SHA256SUMS
        run: |
          mkdir -p out
          bash scripts/release-flatten.sh artifacts bundle
          # NOTICE ships with every release as a loose file; the manifest checksums it but does not classify it.
          cp NOTICE bundle/NOTICE
          go run ./cmd/release-manifest manifest -dir bundle -version "${TAG}" -repo "${RELEASES_REPO:-monoes/mono-agent-releases}"
          cp bundle/manifest.json bundle/SHA256SUMS out/
          {
            echo "### Unsigned update manifest for ${TAG}"
            echo ""
            echo "The \`sign-manifest\` job (environment \`release\`) verifies this manifest against the built assets and signs it (docs/release-runbook.md)."
            echo ""
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-manifest
          path: out/

  # ─── 3. Publish GitHub Release with all artifacts ─────────────────────────
  release:
    needs: [version, build-cli, build-cli-macos, build-macos-arm64, build-windows, build-linux, build-chrome-extension, release-guard]
    runs-on: ubuntu-latest
    # Gates publication on approval from whoever the `release` environment's
    # required reviewers are set to in repo settings (MA-09): tests passing
    # is a correctness gate, not an authorization control, for a workflow
    # that can auto-publish on every push to master. This job blocks here
    # until a reviewer approves — build/artifact jobs above are unaffected
    # and still run on every push. If the `release` environment does not
    # exist yet (or has no required reviewers configured), this has no
    # effect and publication proceeds as before — see SECURITY.md for the
    # exact repo settings to enable this.
    environment: release
    # id-token: write lets actions/attest-build-provenance mint a Sigstore
    # signature over an OIDC token scoped to this repo/commit/workflow run;
    # attestations: write publishes the resulting attestation to the repo
    # (MA-13) so `gh attestation verify` can tie a downloaded artifact back
    # to exactly this build, without needing a maintainer-held signing key.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG:  ${{ needs.version.outputs.tag }}
      PREV: ${{ needs.version.outputs.prev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Flatten and checksum all release files
        run: |
          # unsigned-manifest/ belongs to the releases-repo flow below, not to this release.
          # The script fails on two files with the same name instead of overwriting one.
          bash scripts/release-flatten.sh artifacts release-files unsigned-manifest
          cp NOTICE release-files/NOTICE
          cmp NOTICE <(tar -xOf release-files/MonoAgent-linux-amd64.tar.gz NOTICE)
          cmp NOTICE <(unzip -p release-files/MonoAgent-darwin-arm64.zip MonoAgent.app/Contents/Resources/NOTICE)
          cmp NOTICE <(unzip -p release-files/monoagent-chrome-extension.zip chrome-extension/NOTICE)
          cd release-files
          sha256sum * > SHA256SUMS.txt
          echo "--- Release files ---"
          ls -lh

      # SLSA provenance attestation (MA-13): cryptographically ties every
      # release-files/ hash — including SHA256SUMS.txt itself — to this
      # exact repo, commit, and workflow run. Verify a downloaded artifact
      # with: gh attestation verify <file> -R monoes/mono-agent
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release-files/*"

      - name: Generate release notes
        id: notes
        run: |
          PREV="${PREV}"
          TAG="${TAG}"
          if [ -z "$PREV" ]; then
            COMMITS=$(git log --oneline --no-decorate)
          else
            COMMITS=$(git log --oneline --no-decorate "${PREV}..HEAD")
          fi
          FEATS=$(echo "$COMMITS"  | grep -E '^[0-9a-f]+ feat(\(.+\))?:'  | sed 's/^[0-9a-f]* //')
          FIXES=$(echo "$COMMITS"  | grep -E '^[0-9a-f]+ fix(\(.+\))?:'   | sed 's/^[0-9a-f]* //')
          BUILDS=$(echo "$COMMITS" | grep -E '^[0-9a-f]+ build(\(.+\))?:' | sed 's/^[0-9a-f]* //')
          OTHERS=$(echo "$COMMITS" | grep -vE '^[0-9a-f]+ (feat|fix|docs?|build)(\(.+\))?:' | sed 's/^[0-9a-f]* //')

          # A CHANGELOG section for this version is written by a person and
          # says what the release means; the generated list below is a commit
          # dump. Prefer the section when it exists, fall back when it does
          # not, so nothing depends on remembering to write one.
          CHANGELOG_SECTION=$(awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md 2>/dev/null)

          {
            echo 'NOTES<<RELEASE_EOF'
            echo "## What's New in ${TAG}"
            echo ""
            if [ -n "$CHANGELOG_SECTION" ]; then
              echo "$CHANGELOG_SECTION"
              echo ""
            fi
            if [ -z "$CHANGELOG_SECTION" ] && [ -n "$FEATS" ]; then
              echo "### ✨ New Features"
              echo "$FEATS" | while read -r l; do echo "- $(echo "$l" | sed 's/^feat([^)]*): //;s/^feat: //')"; done
              echo ""
            fi
            if [ -z "$CHANGELOG_SECTION" ] && [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES" | while read -r l; do echo "- $(echo "$l" | sed 's/^fix([^)]*): //;s/^fix: //')"; done
              echo ""
            fi
            if [ -z "$CHANGELOG_SECTION" ] && [ -n "$BUILDS" ]; then
              echo "### 🔧 Build & CI"
              echo "$BUILDS" | while read -r l; do echo "- $(echo "$l" | sed 's/^build([^)]*): //;s/^build: //')"; done
              echo ""
            fi
            if [ -z "$CHANGELOG_SECTION" ] && [ -n "$OTHERS" ]; then
              echo "### 🔄 Other Changes"
              echo "$OTHERS" | while read -r l; do [ -n "$l" ] && echo "- $l"; done
              echo ""
            fi
            echo "---"
            echo ""
            echo "## Desktop App Downloads"
            echo ""
            echo "| Platform | Download |"
            echo "|----------|----------|"
            echo "| macOS (Apple Silicon) | [MonoAgent-darwin-arm64.zip](https://github.com/monoes/mono-agent/releases/download/${TAG}/MonoAgent-darwin-arm64.zip) |"
            echo "| Windows | [MonoAgent-windows-amd64.exe](https://github.com/monoes/mono-agent/releases/download/${TAG}/MonoAgent-windows-amd64.exe) + [monoagentcli-windows-amd64-bundled.exe](https://github.com/monoes/mono-agent/releases/download/${TAG}/monoagentcli-windows-amd64-bundled.exe) (save both in the same folder) |"
            echo "| Linux | [MonoAgent-linux-amd64.tar.gz](https://github.com/monoes/mono-agent/releases/download/${TAG}/MonoAgent-linux-amd64.tar.gz) |"
            echo ""
            echo "## CLI Downloads"
            echo ""
            echo '```bash'
            echo "# macOS (Apple Silicon)"
            echo "curl -fsSL https://github.com/monoes/mono-agent/releases/download/${TAG}/monoagentcli-darwin-arm64 -o monoagentcli && chmod +x monoagentcli && sudo mv monoagentcli /usr/local/bin/"
            echo ""
            echo "# Linux (x86_64)"
            echo "curl -fsSL https://github.com/monoes/mono-agent/releases/download/${TAG}/monoagentcli-linux-amd64 -o monoagentcli && chmod +x monoagentcli && sudo mv monoagentcli /usr/local/bin/"
            echo ""
            echo "# Linux (arm64)"
            echo "curl -fsSL https://github.com/monoes/mono-agent/releases/download/${TAG}/monoagentcli-linux-arm64 -o monoagentcli && chmod +x monoagentcli && sudo mv monoagentcli /usr/local/bin/"
            echo ""
            echo "# Self-update (once installed)"
            echo "monoagentcli update"
            echo '```'
            echo ""
            echo "## Chrome Extension"
            echo ""
            echo "Bridges monoagentcli to your real, already-logged-in Chrome browser. Not on the Web Store — download, unzip, and load unpacked:"
            echo ""
            echo "1. Download [monoagent-chrome-extension.zip](https://github.com/monoes/mono-agent/releases/download/${TAG}/monoagent-chrome-extension.zip) and unzip it"
            echo "2. Open \`chrome://extensions\`, enable **Developer mode**"
            echo "3. Click **Load unpacked** and select the unzipped \`chrome-extension\` folder"
            echo 'RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          body: ${{ steps.notes.outputs.NOTES }}
          files: release-files/*

  # ─── 4. Sign the manifest ──────────────────────────────────────────────────
  # The release signing key lives ONLY as the `release` environment secret RELEASE_SIGNING_KEY.
  # GitHub hands an environment secret to a job only after the environment's protection rules
  # pass (required reviewer approval, deployment branch = master), and this job additionally
  # runs only for a push to master. The key is put in the env of the single signing step; no
  # other step, and no job-level env, has it. Before signing, release-manifest recomputes the
  # sha256 and size of every built asset and refuses on any mismatch, on a version that is not
  # the tag being released, or on a version lower than the latest published release.
  # What this does NOT stop: anyone who can change this workflow on master AND approve the
  # `release` environment can sign what they like. Branch protection on master and required
  # reviewers on the environment are the controls (SECURITY.md, "Release governance").
  sign-manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [version, release-manifest, release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
      RELEASES_REPO: ${{ secrets.RELEASES_REPO }}
    steps:
      - name: Is a releases repo configured
        id: gate
        run: |
          set +x
          if [ -z "${RELEASES_REPO}" ]; then
            echo "::notice::RELEASES_REPO is not set: no signed manifest is produced."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      # The min-version floor comes from the RELEASES repo, not from this repo: the `release` job
      # has already published ${TAG} here, so this repo's latest release is always the one being
      # signed. An API failure fails the job (closed); an empty list is accepted only for the very
      # first release.
      - name: Latest published release in the releases repo
        if: steps.gate.outputs.enabled == 'true'
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          list=$(gh release list --repo "${RELEASES_REPO}" --limit 1000 --json tagName -q '.[].tagName')
          others=$(printf '%s\n' "${list}" | grep -vxF "${TAG}" | grep -v '^$' || true)
          if [ -z "${others}" ]; then
            echo "::notice::No earlier release in ${RELEASES_REPO}: first release, no version floor."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(printf '%s\n' "${others}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "${latest}" ]; then
            echo "::error::${RELEASES_REPO} has releases but none is a vX.Y.Z tag: refusing to sign without a version floor."
            exit 1
          fi
          echo "Latest published release in ${RELEASES_REPO}: ${latest}"
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"

      # Compile the tool and flatten the inputs in steps that do NOT have the key. The signing step
      # below only runs the finished binary, so no `go build`/`go run` (module download, build
      # scripts, generate directives) executes with the key in its environment.
      - name: Build the signing tool and gather the built files
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          go build -o "${RUNNER_TEMP}/release-manifest" ./cmd/release-manifest
          bash scripts/release-flatten.sh artifacts bundle unsigned-manifest
          cp NOTICE bundle/NOTICE
          mkdir -p signed
          cp artifacts/unsigned-manifest/manifest.json signed/manifest.json

      - name: Sign the manifest after checking it against the built assets
        if: steps.gate.outputs.enabled == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          LATEST: ${{ steps.latest.outputs.tag }}
        run: |
          set +x
          min_args=()
          if [ -n "${LATEST}" ]; then min_args=(-min-version "${LATEST}"); fi
          "${RUNNER_TEMP}/release-manifest" sign \
            -manifest signed/manifest.json \
            -key-env RELEASE_SIGNING_KEY \
            -assets-dir bundle \
            -expect-version "${TAG}" \
            -url-prefix "https://github.com/${RELEASES_REPO}/releases/download/${TAG}/" \
            "${min_args[@]}" \
            -pubkey-out signed/signing-pubkey.txt

      # Fails unless the signing key is pinned in internal/release/keys.go (so clients will trust
      # it). The only exception is the repository variable RELEASE_SIGNING_BOOTSTRAP=true, which
      # the owner sets for the one release that first ships the pin (docs/release-runbook.md).
      - name: Self-check the signature
        if: steps.gate.outputs.enabled == 'true'
        env:
          BOOTSTRAP: ${{ vars.RELEASE_SIGNING_BOOTSTRAP }}
        run: |
          set +x
          keyid=$(cut -d' ' -f1 signed/signing-pubkey.txt)
          if grep -q "\"${keyid} " internal/release/keys.go; then
            if [ "${BOOTSTRAP}" = "true" ]; then
              echo "::error::Signing key ${keyid} is already pinned in internal/release/keys.go, but RELEASE_SIGNING_BOOTSTRAP is still true. Owner: delete the variable (gh variable delete RELEASE_SIGNING_BOOTSTRAP) and re-run."
              exit 1
            fi
            go run ./cmd/monoagentcli release verify signed/manifest.json signed/manifest.json.sig
          elif [ "${BOOTSTRAP}" = "true" ]; then
            echo "::warning::Bootstrap: signing key ${keyid} is NOT pinned in internal/release/keys.go; verifying against the key derived from the secret. Unset RELEASE_SIGNING_BOOTSTRAP after this release."
            go run ./cmd/monoagentcli release verify --pubkey "$(cat signed/signing-pubkey.txt)" signed/manifest.json signed/manifest.json.sig
          else
            echo "::error::Signing key ${keyid} is not pinned in internal/release/keys.go, so no client would trust this signature. Pin it, or (first release only) set the repository variable RELEASE_SIGNING_BOOTSTRAP=true."
            exit 1
          fi

      - name: Upload the signed manifest
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-manifest
          path: |
            signed/manifest.json
            signed/manifest.json.sig
            signed/signing-pubkey.txt

  # ─── 5. Optional: mirror assets + signed manifest to the releases-only repo ──
  # Runs only after the `release` environment approval and a successful sign-manifest, and does
  # nothing unless the secrets RELEASES_REPO and RELEASES_REPO_TOKEN both exist. Assets,
  # manifest.json and manifest.json.sig go up together, so the unsigned manifest never sits
  # alone in the public release.
  publish-releases-repo:
    needs: [version, release-manifest, release, sign-manifest]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
      RELEASES_REPO: ${{ secrets.RELEASES_REPO }}
    steps:
      - name: Is a releases repo configured
        id: gate
        run: |
          set +x
          if [ -z "${RELEASES_REPO}" ]; then
            echo "::notice::RELEASES_REPO is not set: nothing to publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      # This job re-downloads the artifacts, so nothing it uploads may rest on the earlier jobs'
      # checks alone. It re-verifies the signature, then recomputes the sha256 and size of every
      # file it will upload against the SIGNED manifest and aborts on any mismatch. Only files the
      # manifest lists are uploaded, and SHA256SUMS is regenerated from those verified files.
      - name: Re-verify the signed manifest and every file to upload
        if: steps.gate.outputs.enabled == 'true'
        env:
          BOOTSTRAP: ${{ vars.RELEASE_SIGNING_BOOTSTRAP }}
        run: |
          set -euo pipefail
          signed=artifacts/signed-manifest
          for f in manifest.json manifest.json.sig signing-pubkey.txt; do
            [ -f "${signed}/${f}" ] || { echo "::error::signed-manifest artifact lacks ${f}; refusing to publish."; exit 1; }
          done
          go build -o "${RUNNER_TEMP}/release-manifest" ./cmd/release-manifest
          go build -o "${RUNNER_TEMP}/monoagentcli" ./cmd/monoagentcli

          keyid=$(cut -d' ' -f1 "${signed}/manifest.json.sig")
          if grep -q "\"${keyid} " internal/release/keys.go; then
            if [ "${BOOTSTRAP}" = "true" ]; then
              echo "::error::Signing key ${keyid} is already pinned in internal/release/keys.go, but RELEASE_SIGNING_BOOTSTRAP is still true. Owner: delete the variable (gh variable delete RELEASE_SIGNING_BOOTSTRAP) and re-run."
              exit 1
            fi
            "${RUNNER_TEMP}/monoagentcli" release verify "${signed}/manifest.json" "${signed}/manifest.json.sig"
          elif [ "${BOOTSTRAP}" = "true" ]; then
            echo "::warning::Bootstrap: key ${keyid} is not pinned; verifying against the key derived by sign-manifest."
            "${RUNNER_TEMP}/monoagentcli" release verify --pubkey "$(cat "${signed}/signing-pubkey.txt")" "${signed}/manifest.json" "${signed}/manifest.json.sig"
          else
            echo "::error::Signing key ${keyid} is not pinned in internal/release/keys.go and RELEASE_SIGNING_BOOTSTRAP is not true."
            exit 1
          fi

          bash scripts/release-flatten.sh artifacts pool unsigned-manifest signed-manifest
          mkdir -p upload
          jq -r '.assets[].name' "${signed}/manifest.json" | while IFS= read -r name; do
            case "${name}" in
              ''|*[!A-Za-z0-9._-]*) echo "::error::unsafe asset name in the manifest: '${name}'"; exit 1 ;;
            esac
            [ -f "pool/${name}" ] || { echo "::error::manifest lists ${name} but it was not built"; exit 1; }
            cp "pool/${name}" "upload/${name}"
          done
          cp "${signed}/manifest.json" "${signed}/manifest.json.sig" upload/
          # NOTICE ships as a loose file; it is not a manifest asset, so it comes from this checkout
          # (the release job already proved it equals the copies inside the archives).
          cp NOTICE upload/NOTICE
          "${RUNNER_TEMP}/release-manifest" check \
            -manifest "${signed}/manifest.json" \
            -assets-dir upload \
            -expect-version "${TAG}" \
            -url-prefix "https://github.com/${RELEASES_REPO}/releases/download/${TAG}/" \
            -strict
          # SHA256SUMS comes from the verified files, never from the unsigned artifact.
          (cd upload && { jq -r '.assets[].name' manifest.json; echo NOTICE; } | sort | xargs sha256sum > SHA256SUMS)

      - name: Upload to the releases repo
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set +x
          if [ -z "${GH_TOKEN}" ]; then
            echo "RELEASES_REPO_TOKEN not set: skipping the releases-repo publish."
            exit 0
          fi
          if gh release view "${TAG}" --repo "${RELEASES_REPO}" >/dev/null 2>&1; then
            # A different version always makes a new release, so an existing one is a re-run.
            # Never replace a manifest that is already signed.
            if gh release view "${TAG}" --repo "${RELEASES_REPO}" --json assets -q '.assets[].name' | grep -qx 'manifest.json.sig'; then
              echo "::error::${RELEASES_REPO} release ${TAG} already has manifest.json.sig; refusing to overwrite manifest.json. Delete the signature deliberately first if this re-run is intended."
              exit 1
            fi
            gh release upload "${TAG}" upload/* --repo "${RELEASES_REPO}" --clobber
          else
            gh release create "${TAG}" upload/* --repo "${RELEASES_REPO}" --title "${TAG}" \
              --notes "Release ${TAG}. Update integrity: manifest.json is verified against manifest.json.sig."
          fi
